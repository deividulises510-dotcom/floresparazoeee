<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌻 Feliz 21 de Septiembre 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87CEEB; }
  body { font-family:'Quicksand', sans-serif; touch-action:manipulation; }
  canvas { display:block; position:fixed; inset:0; cursor:pointer; }
  #hint {
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.75); backdrop-filter:blur(6px);
    padding:10px 22px; border-radius:50px; color:#6b5200;
    font-weight:700; font-size:clamp(13px,2.5vw,17px);
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    animation:hintPulse 2.2s ease-in-out infinite;
    pointer-events:none; z-index:10; transition:opacity 1.5s;
    white-space:nowrap;
  }
  @keyframes hintPulse { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.06)} }
  #title {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.85); font-size:12px; letter-spacing:2px;
    text-transform:uppercase; pointer-events:none; z-index:10; text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
</style>
<base target="_blank">
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">🌻 Haz clic en la pantalla para más flores amarillas 💛</div>
<div id="title">21 · Septiembre</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

/* ============ UTILS ============ */
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const PETALS = ['#FFD93D', '#FFC93C', '#F7C31F', '#FFE066', '#FFDF3D'];

/* ============ SKY & LAND ============ */
function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  g.addColorStop(0, '#4FA8E8');
  g.addColorStop(0.55, '#8FD0F5');
  g.addColorStop(1, '#FFF3B0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // Sun
  const sx = W * 0.78, sy = H * 0.18;
  const pulse = 1 + Math.sin(t * 0.0012) * 0.04;
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120 * pulse);
  glow.addColorStop(0, 'rgba(255,240,150,.95)');
  glow.addColorStop(0.4, 'rgba(255,220,90,.45)');
  glow.addColorStop(1, 'rgba(255,220,90,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 120 * pulse, 0, TAU); ctx.fill();
  ctx.fillStyle = '#FFE873';
  ctx.beginPath(); ctx.arc(sx, sy, 42 * pulse, 0, TAU); ctx.fill();
}

/* Clouds */
const clouds = [];
for (let i = 0; i < 7; i++) {
  clouds.push({
    x: Math.random() * 2000, y: rand(0.05, 0.32),
    s: rand(0.6, 1.4), v: rand(0.15, 0.45), puffs: 4 + (Math.random() * 3 | 0)
  });
}
function drawClouds() {
  clouds.forEach(c => {
    c.x += c.v;
    if (c.x - 200 * c.s > W) c.x = -250 * c.s;
    const cy = H * c.y;
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.beginPath();
    for (let i = 0; i < c.puffs; i++) {
      const px = c.x + (i - c.puffs / 2) * 34 * c.s;
      const pr = (26 + Math.sin(i * 2.1) * 8) * c.s;
      ctx.moveTo(px + pr, cy);
      ctx.arc(px, cy, pr, 0, TAU);
    }
    ctx.fill();
  });
}

/* Hills / grass */
function hillY(x, base, amp, freq, phase) {
  return base + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.7 + phase * 1.7) * amp * 0.4;
}
function drawHills() {
  const layers = [
    { base: H * 0.62, amp: 26, freq: 0.0022, color: '#9CCB4A', phase: 1.3 },
    { base: H * 0.70, amp: 34, freq: 0.0018, color: '#7DBA38', phase: 4.1 },
    { base: H * 0.80, amp: 40, freq: 0.0015, color: '#5FA82E', phase: 7.7 }
  ];
  layers.forEach(L => {
    ctx.fillStyle = L.color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, hillY(x, L.base, L.amp, L.freq, L.phase));
    ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
  });
  // foreground grass gradient
  const g = ctx.createLinearGradient(0, H * 0.78, 0, H);
  g.addColorStop(0, '#4E9A26');
  g.addColorStop(1, '#2F6E14');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, hillY(x, H * 0.86, 30, 0.0013, 2.2));
  ctx.lineTo(W, H);
  ctx.closePath(); ctx.fill();
  // grass blades
  ctx.strokeStyle = 'rgba(40,110,20,.55)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 90; i++) {
    const bx = (i / 90) * W + Math.sin(i * 7) * 20;
    const by = H * 0.9 + Math.sin(i * 3.3) * H * 0.06;
    const bh = 10 + (i % 5) * 4;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + Math.sin(i) * 5, by - bh * 0.6, bx + Math.sin(i * 2) * 9, by - bh);
    ctx.stroke();
  }
}

/* ============ FLOWERS ============ */
const flowers = [];
function makeFlower(x, y, depth, pop = true) {
  const type = Math.random() < 0.45 ? 'sunflower' : 'daisy';
  return {
    x, y, depth,
    h: rand(45, 110) * (0.6 + depth * 0.55),
    size: rand(11, 22) * (0.6 + depth * 0.6),
    type,
    petals: type === 'sunflower' ? 16 : (8 + (Math.random() * 4 | 0)),
    color: PETALS[(Math.random() * PETALS.length) | 0],
    phase: Math.random() * TAU,
    swayFreq: rand(0.0009, 0.0016),
    swayAmp: rand(6, 16),
    popT: pop ? 0 : 1,           // pop-in animation 0..1
    leafAt: rand(0.3, 0.55),
    born: performance.now()
  };
}
// initial field
for (let i = 0; i < 150; i++) {
  const depth = Math.random();
  const y = H * (0.66 + depth * 0.32);
  flowers.push(makeFlower(Math.random() * W, y, depth, false));
}
flowers.sort((a, b) => a.depth - b.depth);

function drawFlower(f, t) {
  const grow = f.popT;
  if (grow <= 0.01) return;
  const h = f.h * grow;
  const sway = Math.sin(t * f.swayFreq + f.phase) * f.swayAmp * (0.5 + f.depth);
  const hx = f.x + sway;
  const hy = f.y - h;

  // stem
  ctx.strokeStyle = '#3E7C1E';
  ctx.lineWidth = Math.max(1.5, 3.2 * (0.5 + f.depth));
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(f.x, f.y);
  ctx.quadraticCurveTo(f.x + sway * 0.3, f.y - h * 0.55, hx, hy);
  ctx.stroke();

  // leaf
  if (grow > 0.5) {
    const lx = f.x + sway * 0.3, ly = f.y - h * f.leafAt;
    ctx.fillStyle = '#4C9423';
    ctx.beginPath();
    ctx.ellipse(lx + 8, ly, 11 * (0.5 + f.depth), 4.5, -0.5, 0, TAU);
    ctx.fill();
  }

  // head
  const s = f.size * grow;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(Math.sin(t * f.swayFreq + f.phase + 1) * 0.12);

  if (f.type === 'sunflower') {
    // back petals
    ctx.fillStyle = f.color;
    for (let i = 0; i < f.petals; i++) {
      const a = (i / f.petals) * TAU;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(s * 0.75, 0, s * 0.62, s * 0.2, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    // darker inner petals
    ctx.fillStyle = '#F5A623';
    for (let i = 0; i < f.petals; i++) {
      const a = ((i + 0.5) / f.petals) * TAU;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(s * 0.5, 0, s * 0.42, s * 0.14, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    // center with seed dots
    ctx.fillStyle = '#5C3A0F';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7A5220';
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * TAU, r = s * 0.22 + (i % 2) * s * 0.12;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, s * 0.045, 0, TAU); ctx.fill();
    }
  } else {
    // daisy petals
    ctx.fillStyle = f.color;
    for (let i = 0; i < f.petals; i++) {
      const a = (i / f.petals) * TAU;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(s * 0.6, 0, s * 0.58, s * 0.24, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#B8860B';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.34, 0, TAU); ctx.fill();
    ctx.fillStyle = '#E8A93D';
    ctx.beginPath(); ctx.arc(-s * 0.08, -s * 0.08, s * 0.2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ============ BUTTERFLIES ============ */
const butterflies = [];
for (let i = 0; i < 4; i++) {
  butterflies.push({
    x: Math.random() * W, y: rand(H * 0.3, H * 0.6),
    vx: rand(0.3, 0.8) * (Math.random() < 0.5 ? -1 : 1),
    ph: Math.random() * TAU, s: rand(0.7, 1.2), hue: Math.random() < 0.6 ? '#FFDE59' : '#FFF3B0'
  });
}
function drawButterflies(t) {
  butterflies.forEach(b => {
    b.x += b.vx;
    b.y += Math.sin(t * 0.002 + b.ph) * 0.6;
    if (b.x < -40) b.x = W + 40; if (b.x > W + 40) b.x = -40;
    const flap = Math.sin(t * 0.018 + b.ph) * 0.9;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.s, b.s);
    ctx.fillStyle = b.hue;
    [[-1, flap], [1, -flap]].forEach(([side, f]) => {
      ctx.save();
      ctx.rotate(f * 0.6);
      ctx.beginPath();
      ctx.ellipse(side * 7, -4, 8, 5, side * 0.6, 0, TAU);
      ctx.ellipse(side * 6, 4, 6, 4, side * -0.4, 0, TAU);
      ctx.fill();
      ctx.restore();
    });
    ctx.fillStyle = '#4a3b12';
    ctx.fillRect(-1, -6, 2, 12);
    ctx.restore();
  });
}

/* ============ PETAL PARTICLES ============ */
const petals = [];
function burstPetals(x, y, n) {
  for (let i = 0; i < n; i++) {
    petals.push({
      x, y, vx: rand(-2.5, 2.5), vy: rand(-4, -1),
      rot: rand(0, TAU), vr: rand(-0.15, 0.15),
      s: rand(4, 9), life: 1, decay: rand(0.004, 0.01),
      color: PETALS[(Math.random() * PETALS.length) | 0]
    });
  }
}
function drawPetals() {
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.985;
    p.rot += p.vr; p.life -= p.decay;
    if (p.life <= 0 || p.y > H + 20) { petals.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.45, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============ FLOATING PHRASES ============ */
const PHRASES = ['Feliz 21 de septiembre compare :3', '☁️ compare :3', '🌻 Feliz 21 de septiembre ☁️'];
const bubbles = [];
let nextBubbleAt = performance.now() + 2500;

function spawnBubble() {
  const text = PHRASES[(Math.random() * PHRASES.length) | 0];
  bubbles.push({
    text, born: performance.now(),
    x: rand(W * 0.2, W * 0.8), y: H * 0.42,
    dur: 5200, hue: rand(0, 1) < 0.5 ? '#FFD93D' : '#FFF0A0'
  });
  burstPetals(rand(W * 0.2, W * 0.8), H * 0.5, 18);
}

function drawBubbles(t) {
  if (t > nextBubbleAt) { spawnBubble(); nextBubbleAt = t + rand(7000, 13000); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    const age = t - b.born;
    if (age > b.dur) { bubbles.splice(i, 1); continue; }
    const p = age / b.dur;
    const inA = Math.min(1, age / 500);
    const outA = p > 0.8 ? (1 - p) / 0.2 : 1;
    const alpha = Math.min(inA, outA);
    const scale = p < 0.12 ? 0.4 + (p / 0.12) * 0.6 : 1 + Math.sin(p * Math.PI) * 0.05;
    const floatY = Math.sin(p * Math.PI * 2) * 12 - p * 20;

    const fs = Math.min(W * 0.07, 46);
    ctx.save();
    ctx.translate(b.x, b.y + floatY);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    // nubesita ☁️
    ctx.font = `700 ${fs}px Pacifico, cursive`;
    const tw = ctx.measureText(b.text).width;
    const cw = tw + 120;                    // ancho total de la nube
    const puff = fs * 0.55;
    const n = Math.max(5, Math.round(cw / (puff * 1.1)));
    // sombra suave
    ctx.save();
    ctx.shadowColor = 'rgba(90,130,180,.35)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 8;
    // base de la nube
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.roundRect(-cw / 2, -puff * 0.45, cw, puff * 1.5, puff * 0.75);
    ctx.fill();
    // pompones de la nube
    for (let i = 0; i < n; i++) {
      const px = -cw / 2 + (i / (n - 1)) * cw;
      const py = -puff * 0.45 - Math.sin((i / (n - 1)) * Math.PI) * puff * 0.55;
      const pr = puff * (0.75 + Math.sin(i * 1.7) * 0.18);
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    // borde sutil
    ctx.strokeStyle = 'rgba(160,200,240,.6)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(-cw / 2, -puff * 0.45, cw, puff * 1.5, puff * 0.75);
    ctx.stroke();

    // text with shadow
    ctx.shadowColor = 'rgba(180,120,0,.45)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#8a6100';
    ctx.fillText(b.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============ CLICK -> MORE FLOWERS ============ */
function plantAt(px, py) {
  const n = 7 + (Math.random() * 6 | 0);
  for (let i = 0; i < n; i++) {
    const depth = rand(0.35, 1);
    const x = px + rand(-90, 90);
    const y = Math.max(H * 0.6, py + rand(-25, 55));
    const f = makeFlower(x, Math.min(y, H * 0.99), depth, true);
    f.popDelay = i * 90;             // staggered blooming
    flowers.push(f);
  }
  flowers.sort((a, b) => a.depth - b.depth);
  burstPetals(px, py, 14);
  // hide hint after first click
  const hint = document.getElementById('hint');
  if (hint.style.opacity !== '0') {
    setTimeout(() => hint.style.opacity = '0', 1200);
  }
}
canvas.addEventListener('pointerdown', e => plantAt(e.clientX, e.clientY));

// a few flowers bloom on their own every couple seconds
setInterval(() => {
  if (flowers.length > 420) return;
  const f = makeFlower(Math.random() * W, rand(H * 0.7, H * 0.98), rand(0.4, 1), true);
  flowers.push(f);
  flowers.sort((a, b) => a.depth - b.depth);
}, 2200);

/* ============ MAIN LOOP ============ */
function frame(t) {
  drawSky(t);
  drawClouds();
  drawHills();
  for (const f of flowers) {
    if (f.popDelay && t - f.born > f.popDelay) { f.popT = Math.min(1, (t - f.born - f.popDelay) / 700); }
    else if (!f.popDelay) f.popT = Math.min(1, (t - f.born) / 700);
    drawFlower(f, t);
  }
  drawPetals();
  drawButterflies(t);
  drawBubbles(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
